<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG card — Shubham Neupane</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #ffffff;
        --ink: #1e3a2b;
        --butter: #efd97a;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card { width: 1200px; height: 630px; display: flex; flex-direction: column; }

      /* ---- white upper field ---- */
      .top { flex: 1; padding: 52px 64px 0; display: flex; flex-direction: column; }

      .meta {
        display: flex; justify-content: space-between; align-items: baseline;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 15px; text-transform: uppercase; letter-spacing: 0.13em;
      }
      .avail { font-weight: 500; }
      .rule { height: 1.5px; background: var(--ink); margin: 20px 0 0; }

      .body { flex: 1; display: flex; align-items: center; gap: 40px; }

      h1 {
        font-weight: 500;
        font-size: 150px;
        line-height: 0.86;
        letter-spacing: -0.045em;
        text-transform: uppercase;
        white-space: nowrap;
      }
      h1 .serif {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.02em;
      }

      .sticker {
        display: inline-block;
        margin-top: 30px;
        font-family: "Kalam", cursive;
        font-size: 27px;
        line-height: 1.25;
        background: var(--butter);
        color: var(--ink);
        padding: 1px 14px 4px;
        border-radius: 7px;
        transform: rotate(-3deg);
      }

      .doodles {
        margin-left: auto;
        margin-right: 8px;
        display: flex;
        align-items: flex-start;
        gap: 4px;
      }
      .doodles .sparkle { margin-top: 112px; }
      .doodles .blob { margin-top: -6px; }
      .doodles svg { display: block; overflow: visible; }

      /* ---- butter band ---- */
      .band {
        background: var(--butter);
        height: 152px;
        padding: 0 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
      }
      .role {
        font-weight: 600;
        font-size: 43px;
        line-height: 1.02;
        letter-spacing: -0.032em;
      }
      .place {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.13em;
        white-space: nowrap;
        text-align: right;
        padding-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="meta">
          <span>Portfolio &mdash; shubhamneupane07.com.np</span>
          <span class="avail">{ Available for work }</span>
        </div>
        <div class="rule"></div>

        <div class="body">
          <div>
            <h1>Shubham<br /><span class="serif">Neupane</span></h1>
            <span class="sticker">six things, all live</span>
          </div>

          <div class="doodles">
            <!-- four-point sparkle -->
            <svg class="sparkle" width="88" height="88" viewBox="0 0 120 120" fill="#EFD97A" stroke="#1E3A2B"
                 stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M60 16 C63 44 70 54 104 60 C70 66 63 76 60 104 C57 76 50 66 16 60 C50 54 57 44 60 16 Z" />
            </svg>
            <!-- blob creature -->
            <svg class="blob" width="216" height="216" viewBox="0 0 120 120" fill="#EFD97A" stroke="#1E3A2B"
                 stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M30 62 C18 58 16 42 28 38 C24 24 40 16 50 24 C54 12 72 12 76 24 C88 18 102 30 94 42 C106 46 106 62 94 66 C100 78 88 90 76 84 C72 96 52 96 48 86 C36 92 24 80 30 62 Z" />
              <ellipse cx="52" cy="56" rx="7" ry="10" />
              <ellipse cx="68" cy="56" rx="7" ry="10" />
              <path d="M59 54 L61 54" />
              <path d="M56 90 L54 106 M63 90 L65 106" />
            </svg>
          </div>
        </div>
      </div>

      <div class="band">
        <div class="role">Full-Stack Engineer &amp; Founder, Aurora Studios</div>
        <div class="place">Kathmandu, Nepal</div>
      </div>
    </div>
  </body>
</html>
